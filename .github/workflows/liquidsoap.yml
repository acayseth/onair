name: Liquidsoap

on:
  push:
    branches:
      - master
    paths:
      - "liquidsoap/**"
      - "!liquidsoap/README.md"
      - ".github/workflows/liquidsoap.yml"

  pull_request:
    paths:
      - "liquidsoap/**"
      - "!liquidsoap/README.md"
      - ".github/workflows/liquidsoap.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/acayseth/liquidsoap

jobs:
  # ==========================================================
  # Verify
  # ==========================================================
  verify:
    name: Verify Liquidsoap
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 1

      # --------------------------------------------------------
      # Get version
      # --------------------------------------------------------
      - name: Get Liquidsoap version
        id: version
        shell: bash
        run: |
          set -e

          VERSION=$(tr -d '[:space:]' < liquidsoap/VERSION)

          if [ -z "$VERSION" ]; then
            echo "ERROR: liquidsoap/VERSION is empty"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version: ${VERSION}"
            echo "Expected format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo
          echo "=========================================="
          echo "Liquidsoap"
          echo "=========================================="
          echo "Version:    ${VERSION}"
          echo "Commit:     ${SHA}"
          echo "Short SHA:  ${SHORT_SHA}"
          echo "Image:      ${IMAGE_NAME}"
          echo "Event:      ${GITHUB_EVENT_NAME}"
          echo "=========================================="
          echo

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # Build
  # ==========================================================
  build:
    name: Build Liquidsoap - Multi-platform
    needs: verify
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 1

      # --------------------------------------------------------
      # QEMU
      # --------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # --------------------------------------------------------
      # Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Login to GHCR
      # Only needed when publishing
      # --------------------------------------------------------
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "${{ secrets.TOKEN }}" | docker login ghcr.io \
            --username acayseth \
            --password-stdin

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Liquidsoap
        uses: docker/build-push-action@v6
        with:
          context: ./liquidsoap
          file: ./liquidsoap/Dockerfile

          build-args: |
            LIQUIDSOAP_VERSION=${{ needs.verify.outputs.version }}

          platforms: |
            linux/amd64
            linux/arm64

          push: ${{ github.event_name == 'push' }}

          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.verify.outputs.short_sha }}

          labels: |
            org.opencontainers.image.title=Liquidsoap
            org.opencontainers.image.description=Docker image for Liquidsoap
            org.opencontainers.image.source=https://github.com/acayseth/onair
            org.opencontainers.image.documentation=https://github.com/acayseth/onair/tree/master/liquidsoap
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}

  # ==========================================================
  # Publish
  # ==========================================================
  publish:
    name: Publish Liquidsoap
    if: github.event_name == 'push'
    needs:
      - verify
      - build

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Login to GHCR
      # --------------------------------------------------------
      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.TOKEN }}" | docker login ghcr.io \
            --username acayseth \
            --password-stdin

      # --------------------------------------------------------
      # Set up Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Publish latest
      # --------------------------------------------------------
      - name: Publish latest tag
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ needs.verify.outputs.version }}"

      # --------------------------------------------------------
      # Show published images
      # --------------------------------------------------------
      - name: Show published images
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "Liquidsoap published successfully"
          echo "=========================================="
          echo
          echo "Version:"
          echo "  ${IMAGE_NAME}:${{ needs.verify.outputs.version }}"
          echo
          echo "Commit:"
          echo "  ${IMAGE_NAME}:sha-${{ needs.verify.outputs.short_sha }}"
          echo
          echo "Latest:"
          echo "  ${IMAGE_NAME}:latest"
          echo
          echo "Git commit:"
          echo "  ${{ needs.verify.outputs.sha }}"
          echo
          echo "=========================================="
