name: Web Player

on:
  push:
    branches:
      - master
    paths:
      - "ui/web/**"
      - "!ui/web/README.md"
      - ".github/workflows/web.yml"

  pull_request:
    paths:
      - "ui/web/**"
      - "!ui/web/README.md"
      - ".github/workflows/web.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/acayseth/web-icecast-player
  DOCKERFILE: ui/web/Dockerfile
  CONTEXT: ui/web

jobs:
  # ==========================================================
  # Verify
  # ==========================================================
  verify:
    name: Verify Web Player
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < ui/web/VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid ui/web/VERSION: '${VERSION}'"
            echo "Expected format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Web Player version: ${VERSION}"
          echo "Commit: ${SHA}"
          echo "Image: ${IMAGE_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install dependencies
        working-directory: ui/web
        run: npm ci

      - name: Lint
        working-directory: ui/web
        run: npm run lint --if-present

      - name: Type check
        working-directory: ui/web
        run: npm run typecheck --if-present

      - name: Run tests
        working-directory: ui/web
        run: npm run test --if-present

      - name: Build Next.js application
        working-directory: ui/web
        run: npm run build

  # ==========================================================
  # Docker Build
  # ==========================================================
  build:
    name: Build Web Player Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.verify.outputs.short_sha }}
          cache-from: type=gha,scope=web-player
          cache-to: type=gha,mode=max,scope=web-player

  # ==========================================================
  # Publish
  # ==========================================================
  publish:
    name: Publish Web Player
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - verify
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.verify.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=OnAir Web Player
            org.opencontainers.image.description=Next.js web radio player
            org.opencontainers.image.source=https://github.com/acayseth/onair
            org.opencontainers.image.documentation=https://github.com/acayseth/onair/tree/master/ui/web
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
          cache-from: type=gha,scope=web-player
          cache-to: type=gha,mode=max,scope=web-player

      - name: Publish latest tag
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ needs.verify.outputs.version }}"

      - name: Show published images
        shell: bash
        run: |
          echo "Web Player published successfully"
          echo
          echo "Version: ${IMAGE_NAME}:${{ needs.verify.outputs.version }}"
          echo "Commit:  ${IMAGE_NAME}:sha-${{ needs.verify.outputs.short_sha }}"
          echo "Latest:  ${IMAGE_NAME}:latest"
          echo "Git SHA: ${{ needs.verify.outputs.sha }}"
